<nav class="header">
  <a routerLink="/" class="logo" (click)="chiudiMenu()">SerieBox</a>

  <button
    type="button"
    class="menu-toggle"
    [class.aperto]="menuAperto"
    [attr.aria-expanded]="menuAperto"
    aria-controls="menu-principale"
    aria-label="Apri o chiudi il menu"
    (click)="toggleMenu()"
  >
    @if (!menuAperto) {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    }
  </button>

  @if (menuAperto) {
    <button
      type="button"
      class="menu-overlay"
      aria-label="Chiudi il menu"
      (click)="chiudiMenu()"
    ></button>
  }

  <div
    id="menu-principale"
    class="link"
    [class.menu-aperto]="menuAperto"
  >
    <div class="menu-heading">
      <span>Menu</span>
      <button
        type="button"
        class="menu-close"
        aria-label="Chiudi il menu"
        (click)="chiudiMenu()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>

    <a
      routerLink="/"
      routerLinkActive="attivo"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="chiudiMenu()"
    >
      <span>Home</span>
      <span class="freccia">→</span>
    </a>

    <a
      routerLink="/serie"
      routerLinkActive="attivo"
      (click)="chiudiMenu()"
    >
      <span>Catalogo</span>
      <span class="freccia">→</span>
    </a>

    <a
      routerLink="/preferiti"
      routerLinkActive="attivo"
      (click)="chiudiMenu()"
    >
      <span>Preferiti ({{ preferitiService.totale() }})</span>
      <span class="freccia">→</span>
    </a>

    <a
      routerLink="/about"
      routerLinkActive="attivo"
      (click)="chiudiMenu()"
    >
      <span>About</span>
      <span class="freccia">→</span>
    </a>
  </div>
</nav>
